{% extends 'partials/base_w_nav.html' %}
<html>
<head>
    {% block title %}Eliminar Producto{% endblock %}
</head>
<body>
{% block content %}
<div class="modal-dialog-lg" role="document">
    <form hx-post="{{ request.path }}" class="modal-content">
        {% csrf_token %}
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar Producto</h5>
                <button class="btn-close cerrar" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="color:white">
                <p>¿Estás seguro de que deseas eliminar el producto: <strong>{{ producto.producto.producto.nombre }}</strong>?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger col-2" type="submit">Eliminar</button>
                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
</body>
</html>
