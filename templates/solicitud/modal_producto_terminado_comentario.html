{% extends 'partials/base_w_nav.html' %}
{% load crispy_forms_tags %}
<html>
<head>
    {% block title %}Editar Comentario{% endblock %}
</head>
<body>
{% block content %}
<div class="modal-dialog-lg" role="document">
    <form hx-post="{{ request.path }}" class="modal-content">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Comentario</h5>
                <button class="btn-close cerrar" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="color:white">
                <div>
                    {% csrf_token %}
                    <table class="table table-dark table-striped mx-3">
                        <thead>
                            <tr>
                                <th scope="col">Producto</th>
                                <th scope="col">Comentario</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{{ producto.producto.producto.nombre }}</td>
                                <td>
                                    <textarea name="comentario" id="comentario" class="form-control">{{ producto.comentario }}</textarea>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-info col-2" type="submit">Guardar</button>
                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
</body>
</html>
